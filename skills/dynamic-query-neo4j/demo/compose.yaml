services:
  neo4j:
    image: neo4j:5.26.12-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-openfda-demo}
      DEMO_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-openfda-demo}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${DEMO_NEO4J_PASSWORD}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - neo4j-data:/data

  chatbot:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-openfda-demo}
    command:
      - streamlit
      - run
      - chatbot.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --browser.gatherUsageStats=false
    volumes:
      - ./rsi:/app/rsi

  loader:
    build: .
    profiles: ["load"]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-openfda-demo}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      PURPLEBOOK_URL: ${PURPLEBOOK_URL:-latest}
      ORANGEBOOK_URL: ${ORANGEBOOK_URL:-https://www.fda.gov/media/76860/download}
      SEED_TERMS: ${SEED_TERMS:-adalimumab,trastuzumab,pembrolizumab}
      MAX_APPLICATIONS: ${MAX_APPLICATIONS:-20}
      OPENFDA_LIMIT: ${OPENFDA_LIMIT:-100}
    volumes:
      - ./data:/app/data

volumes:
  neo4j-data:
